<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.home %}{{ page.title }} | {% endunless %}Xinran Liu</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%232b3f48'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia' font-size='32' fill='white'%3EXL%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --ink: #272d30; --muted: #697174; --accent: #345f70; --line: #e3e7e8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font-family: Arial, Helvetica, sans-serif; font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 2px; }
    .skip { position: absolute; left: 16px; top: -100px; padding: 8px 14px; background: white; z-index: 10; }
    .skip:focus { top: 12px; }
    .wrap { width: min(100% - 72px, 1040px); margin-inline: auto; }
    .site-header { border-bottom: 1px solid var(--line); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 28px; min-height: 94px; }
    .brand { font-family: Georgia, 'Times New Roman', serif; font-size: 25px; color: var(--ink); white-space: nowrap; }
    .brand:hover { text-decoration: none; }
    nav { display: flex; align-items: center; gap: 32px; }
    nav a { color: #555e62; font-size: 15px; padding: 8px 0; border-bottom: 2px solid transparent; }
    nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
    main { padding-block: 46px 54px; }
    .home-grid { display: grid; grid-template-columns: 270px minmax(0,1fr); gap: 52px; align-items: start; }
    .portrait { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; }
    h1, h2, h3 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; color: var(--ink); }
    h1 { margin: 0 0 22px; font-size: 34px; line-height: 1.2; letter-spacing: -.6px; }
    h2 { margin: 0 0 18px; font-size: 22px; line-height: 1.35; }
    h3 { margin: 0 0 9px; font-size: 16px; line-height: 1.4; }
    .profile-contact { max-width: 270px; }
    .email-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 14px; }
    .email-row a { font-size: 14px; }
    .copy-email { border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--accent); font: inherit; font-size: 12px; padding: 5px 10px; min-height: 34px; cursor: pointer; }
    .copy-email:hover { background: #f5f8f9; border-color: #b7c8cf; }
    .copy-email:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .copy-status { min-height: 18px; margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .home-copy { padding-top: 4px; }
    .page-main { min-height: 384px; }
    footer { padding-block: 19px 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    @media (max-width: 650px) {
      .wrap { width: calc(100% - 40px); }
      .header-inner { flex-direction: column; align-items: flex-start; gap: 9px; padding-block: 20px 14px; min-height: 0; }
      nav { gap: 25px; width: 100%; }
      nav a { font-size: 14px; }
      main { padding-block: 30px 38px; }
      .home-grid { grid-template-columns: 1fr; gap: 27px; }
      .portrait { max-width: 270px; }
      .home-copy { padding: 0; }
      .page-main { min-height: 320px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Xinran Liu</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.home %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/research/' | relative_url }}"{% if page.section == 'research' %} aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/teaching/' | relative_url }}"{% if page.section == 'teaching' %} aria-current="page"{% endif %}>Teaching</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.section == 'cv' %} aria-current="page"{% endif %}>CV</a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap {% unless page.home %}page-main{% endunless %}">
    {% if page.home %}
    <div class="home-grid">
      <div class="profile-contact">
      <img class="portrait" src="{{ '/assets/portraits/xinran-liu.jpeg' | relative_url }}" width="1122" height="1402" alt="Xinran Liu" fetchpriority="high">
        <div class="email-row">
          <a id="contact-email" href="mailto:xliu342@ucr.edu">xliu342@ucr.edu</a>
          <button class="copy-email" id="copy-email" type="button" aria-label="Copy email address" hidden>Copy</button>
        </div>
        <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
      </div>
      <section class="home-copy" aria-labelledby="name">
        <h1 id="name">Xinran Liu</h1>
        {{ content }}
      </section>
    </div>
    {% else %}
    <h1>{{ page.title }}</h1>
    {{ content }}
    {% endif %}
  </main>
  <footer class="wrap">&copy; {{ 'now' | date: '%Y' }} Xinran Liu</footer>
{% if page.home %}
<script>
(function () {
  var button = document.getElementById('copy-email');
  var email = document.getElementById('contact-email');
  var status = document.getElementById('copy-status');
  var timer;
  button.hidden = false;
  button.addEventListener('click', async function () {
    clearTimeout(timer);
    button.disabled = true;
    var copied = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(email.textContent);
        copied = true;
      }
    } catch (error) {}
    if (!copied) {
      var field = document.createElement('textarea');
      field.value = email.textContent;
      field.setAttribute('readonly', '');
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      field.setSelectionRange(0, field.value.length);
      try { copied = document.execCommand('copy'); } catch (error) {}
      field.remove();
      button.focus();
    }
    button.disabled = false;
    if (copied) {
      button.textContent = 'Copied';
      status.textContent = 'Email address copied.';
      timer = setTimeout(function () {
        button.textContent = 'Copy';
        status.textContent = '';
      }, 3000);
    } else {
      button.textContent = 'Copy';
      status.textContent = 'Please select the email address to copy it.';
      var selection = window.getSelection();
      var range = document.createRange();
      range.selectNodeContents(email);
      selection.removeAllRanges();
      selection.addRange(range);
    }
  });
})();
</script>
{% endif %}
</body>
</html>
